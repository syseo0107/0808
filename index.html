<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>간단한 할일 앱</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>할일 리스트</h1>
      <button id="theme-toggle" type="button">다크모드</button>
    </header>

    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="할 일을 입력하세요" autocomplete="off" />
      <input type="date" id="todo-date" aria-label="마감일" />
      <button type="submit">추가</button>
    </form>

    <div class="todo-summary">
      <span id="todo-count">할 일 0개</span>
      <span id="todo-completed-count">완료 0개</span>
    </div>

    <p id="empty-state" class="empty-state">아직 등록된 할 일이 없어요. 새 할 일을 추가해보세요.</p>
    <ul id="todo-list"></ul>
  </div>
  <script src="script.js"></script>
</body>
</html>
